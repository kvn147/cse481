<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Automatic Waste Disposal</title>
  <script src="https://cdn.jsdelivr.net/npm/roslib/build/roslib.min.js"></script>
  <link rel="stylesheet" href="style.css">
  <style>
    /* New styling for the stateful master toggle button */
    .master-btn-container {
      grid-column: span 2;
      display: flex;
      gap: 10px;
    }
    
    #master-control-btn {
      flex: 1;
      font-weight: bold;
      font-size: 18px;
      transition: background-color 0.3s ease;
    }

    /* Functional UI states for the master toggle */
    #master-control-btn.state-idle { background-color: #2ecc71; }
    #master-control-btn.state-idle:hover { background-color: #27ae60; }
    
    #master-control-btn.state-running { background-color: #f1c40f; color: #2c3e50; }
    #master-control-btn.state-running:hover { background-color: #d4ac0d; }
    
    #master-control-btn.state-paused { background-color: #3498db; }
    #master-control-btn.state-paused:hover { background-color: #2980b9; }

    /* Visual feedback for disabled manual step-execution buttons */
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      background-color: #bdc3c7 !important;
      color: #7f8c8d !important;
      transform: none !important;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Automatic Waste Disposal System</h2>

    <div class="controls">
      <div class="master-btn-container">
        <div class="split-btn-group" id="resume-group" style="width: 100%;">
          <button id="master-control-btn" class="state-idle" onclick="handleMasterToggle()">
            ▶ Start Automatic Disposal
          </button>
          <button id="resume-arrow" class="primary split-arrow" onclick="togglePhaseMenu(event)" disabled style="display: none;">▾</button>
          <div class="phase-menu" id="phase-menu">
            <div class="phase-label">Resume sequence from…</div>
            <button onclick="selectPhase('extraction')">🗑 Extraction</button>
            <button onclick="selectPhase('navigation')">🧭 Navigation</button>
            <button onclick="selectPhase('disposal')">♻️ Disposal</button>
          </div>
        </div>
      </div>

      <button class="step-btn" onclick="executeTask('just_extraction')">Execute Extraction</button>
      <button class="step-btn" onclick="executeTask('just_disposal')">Execute Disposal</button>
      <button class="step-btn" onclick="executeTask('go_to_receptacle')">Execute Navigation</button>
      <button class="secondary" onclick="executeTask('reset')">Reset Robot (Neutral Position)</button>
    </div>

    <div style="display:flex; justify-content:space-between; align-items:center; margin-top:20px; border-bottom:2px solid #3498db; padding-bottom:5px;">
      <h3>Mission Control</h3>
      <span id="status" style="font-family:monospace; margin-left:5px;">Connecting...</span>
    </div>

    <div id="nav-pause-banner">
      ⚠️ <strong>Navigation cancelled.</strong>
      Please teleop the robot to the receptacle, then use the dropdown arrow on the main button to select a custom phase if needed, or hit Resume.
    </div>

    <div class="teleop-side-by-side">
      <div class="control-column-left">
        <h4 style="margin:0 0 10px 0; font-size:14px; color:#2c3e50; text-align:center;">Base Platform</h4>
        <div class="base-controls-wrapper">
          <div class="dpad">
            <button class="dpad-button up"    onclick="executeTask('base_forward')">^</button>
            <button class="dpad-button left"  onclick="executeTask('base_left')">&lt;</button>
            <button class="dpad-button down"  onclick="executeTask('base_backward')">v</button>
            <button class="dpad-button right" onclick="executeTask('base_right')">&gt;</button>
          </div>
        </div>
      </div>

      <div class="portrait-camera-feed-wrapper">
        <div class="camera-feed" id="video">
          <img src="https://video.kevinn.me/stream?topic=/camera/color/image_raw" style="transform:rotate(90deg);">
        </div>
      </div>

      <div class="control-column-right">
        <h4 style="margin:0 0 10px 0; font-size:14px; color:#2c3e50; text-align:center;">Camera Head</h4>
        <div class="dpad">
          <button class="dpad-button up"    onclick="executeTask('camera_up')">^</button>
          <button class="dpad-button left"  onclick="executeTask('camera_left')">&lt;</button>
          <button class="dpad-button down"  onclick="executeTask('camera_down')">v</button>
          <button class="dpad-button right" onclick="executeTask('camera_right')">&gt;</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const ros = new ROSLIB.Ros({ url: "wss://ros.kevinn.me" });

    const taskTopic = new ROSLIB.Topic({
      ros,
      name: "/task_execution",
      messageType: "std_msgs/String"
    });

    const statusSubTopic = new ROSLIB.Topic({
      ros,
      name: "/task_status",
      messageType: "std_msgs/String"
    });

    const statusText      = document.getElementById("status");
    const navPauseBanner  = document.getElementById("nav-pause-banner");
    const phaseMenu       = document.getElementById("phase-menu");
    const masterCtrlBtn   = document.getElementById("master-control-btn");
    const resumeArrow     = document.getElementById("resume-arrow");
    const stepButtons     = document.querySelectorAll(".step-btn");

    // Execution States: "IDLE", "RUNNING", "PAUSED"
    let currentSystemState = "IDLE";
    let selectedPhase      = "extraction";

    ros.on('connection', () => { statusText.innerText = "Connected to Stretch"; statusText.style.color = "#27ae60"; });
    ros.on('error',      () => { statusText.innerText = "Error Connecting to Stretch"; statusText.style.color = "#e74c3c"; });
    ros.on('close',      () => { statusText.innerText = "Connection Closed"; statusText.style.color = "#f39c12"; });

    statusSubTopic.subscribe((msg) => {
      statusSubTopic.subscribe((msg) => {
      statusText.innerText = msg.data;
      
      if (msg.data.startsWith("PAUSED: Navigation")) {
        navPauseBanner.style.display = "block";
        // Ensure the UI enters the paused state if Nav2 interrupts itself
        setSystemState("PAUSED"); 
        
      } else if (msg.data === "Sequence complete!") {
        navPauseBanner.style.display = "none";
        
        // FIX: Only transition back to Start/IDLE if the sequence was actually running.
        // This ignores the false "Sequence complete!" message the backend fires during a Pause reset.
        if (currentSystemState === "RUNNING") {
          setSystemState("IDLE");
        }
      }
    });
    });

    // Central state machine interface update logic
    function setSystemState(state) {
      currentSystemState = state;
      
      // Reset classes
      masterCtrlBtn.className = "";
      
      if (state === "IDLE") {
        masterCtrlBtn.innerText = "▶ Start Automatic Disposal";
        masterCtrlBtn.classList.add("state-idle");
        resumeArrow.style.display = "none";
        resumeArrow.disabled = true;
        toggleManualStepButtons(false); // Enabled
        
      } else if (state === "RUNNING") {
        masterCtrlBtn.innerText = "⏸ Pause Sequence";
        masterCtrlBtn.classList.add("state-running");
        resumeArrow.style.display = "none";
        resumeArrow.disabled = true;
        toggleManualStepButtons(false); // Enabled
        
      } else if (state === "PAUSED") {
        const labels = { extraction: "Extraction", navigation: "Navigation", disposal: "Disposal" };
        masterCtrlBtn.innerText = "🔄 Resume: " + (labels[selectedPhase] || selectedPhase);
        masterCtrlBtn.classList.add("state-paused");
        resumeArrow.style.display = "block";
        resumeArrow.disabled = false;
        toggleManualStepButtons(true); // Greyed out / Disabled
      }
    }

    function toggleManualStepButtons(shouldDisable) {
      stepButtons.forEach(btn => {
        btn.disabled = shouldDisable;
      });
    }

    function handleMasterToggle() {
      if (currentSystemState === "IDLE") {
        // Trigger initial automation pipeline
        executeTask('sequence');
        setSystemState("RUNNING");
        
      } else if (currentSystemState === "RUNNING") {
        // Intercept pipeline execution, halting movements via action client overrides
        setSystemState("PAUSED");
        executeTask('pause');
        statusText.innerText = "Status: Paused — robot resetting to neutral...";
        
      } else if (currentSystemState === "PAUSED") {
        // Dispatch targeted recovery entry point frame back onto backend task processor
        navPauseBanner.style.display = "none";
        const msg = new ROSLIB.Message({ data: "resume:" + selectedPhase });
        taskTopic.publish(msg);
        statusText.innerText = "Status: Resuming from " + selectedPhase + "...";
        setSystemState("RUNNING");
      }
    }

    function executeTask(taskType) {
      taskTopic.publish(new ROSLIB.Message({ data: taskType }));
      statusText.innerText = "Status: Executing " + taskType + "...";
      navPauseBanner.style.display = "none";

      if (taskType === 'sequence' || taskType === 'reset') {
        setSystemState(taskType === 'sequence' ? "RUNNING" : "IDLE");
      }
    }

    function togglePhaseMenu(e) {
      e.stopPropagation();
      phaseMenu.classList.toggle("open");
    }

    function selectPhase(phase) {
      selectedPhase = phase;
      if (currentSystemState === "PAUSED") {
        setSystemState("PAUSED"); // Forces re-render of text string label
      }
      phaseMenu.classList.remove("open");
    }

    document.addEventListener("click", () => phaseMenu.classList.remove("open"));
  </script>
</body>
</html>
