<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Automatic Waste Disposal</title>
  <script src="https://cdn.jsdelivr.net/npm/roslib/build/roslib.min.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h2>Automatic Waste Disposal System</h2>

    <div class="controls">
      <button class="primary" onclick="executeTask('sequence')">Start Automatic Disposal</button>
      <button class="pause" onclick="executeTask('pause')">Pause</button>
      <button onclick="executeTask('extraction')">Execute Extraction</button>
      <button onclick="executeTask('disposal')">Execute Disposal</button>
      <button onclick="executeTask('go_to_receptacle')">Execute Navigation</button>
      <button class="secondary" onclick="executeTask('reset')">Reset Robot (Neutral Position)</button>
    </div>
    
    <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 20px; border-bottom: 2px solid #3498db; padding-bottom: 5px;">
    <h3>Mission Control</h3>
        <span id="status" style="font-family: monospace; margin-left: 5px;">Connecting...</span>
    </div>
    
    <div class="teleop-side-by-side">
      
      <div class="control-column-left">
        <h4 style="margin: 0 0 10px 0; font-size: 14px; color: #2c3e50; text-align: center;">Base Platform</h4>
        <div class="base-controls-wrapper">
          <div class="dpad">
            <button class="dpad-button up" onclick="executeTask('base_forward')">^</button>
            <button class="dpad-button left" onclick="executeTask('base_left')">&lt;</button>
            <button class="dpad-button down" onclick="executeTask('base_backward')">v</button>
            <button class="dpad-button right" onclick="executeTask('base_right')">&gt;</button>
          </div>
        </div>
      </div>

      <div class="portrait-camera-feed-wrapper">
        <div class="camera-feed" id="video">
            <img src="https://video.kevinn.me/stream?topic=/camera/color/image_raw" style="transform: rotate(90deg);">
        </div>
      </div>

      <div class="control-column-right">
        <h4 style="margin: 0 0 10px 0; font-size: 14px; color: #2c3e50; text-align: center;">Camera Head</h4>
        <div class="dpad">
          <button class="dpad-button up" onclick="executeTask('camera_up')">^</button>
          <button class="dpad-button left" onclick="executeTask('camera_left')">&lt;</button>
          <button class="dpad-button down" onclick="executeTask('camera_down')">v</button>
          <button class="dpad-button right" onclick="executeTask('camera_right')">&gt;</button>
        </div>
      </div>

    </div> </div> <script>
    const ros = new ROSLIB.Ros({
      url: "wss://ros.kevinn.me"
    });

    const taskTopic = new ROSLIB.Topic({
      ros: ros,
      name: "/task_execution",
      messageType: "std_msgs/String"
    });

    const statusText = document.getElementById("status");

    ros.on('connection', () => {
      statusText.innerText = "Connected to Stretch";
      statusText.style.color = "#27ae60";
    });

    ros.on('error', (error) => {
      statusText.innerText = "Error Connecting to Stretch";
      statusText.style.color = "#e74c3c";
    });

    ros.on('close', () => {
      statusText.innerText = "Connection Closed";
      statusText.style.color = "#f39c12";
    });

    function executeTask(taskType) {
      const msg = new ROSLIB.Message({
        data: taskType
      });
      taskTopic.publish(msg);
      statusText.innerText = "Status: Executing " + taskType + "...";
      console.log("Published task:", taskType);
    }
  </script>
</body>
</html>
